<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Chart - BTCUSDT</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #131722;
            color: #d1d4dc;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2e39;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
        }

        .controls {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            color: #787b86;
            text-transform: uppercase;
        }

        select, button {
            background: #1e222d;
            border: 1px solid #2a2e39;
            color: #d1d4dc;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover, button:hover {
            background: #2a2e39;
            border-color: #434651;
        }

        button:active {
            transform: scale(0.98);
        }

        button.primary {
            background: #2962ff;
            border-color: #2962ff;
        }

        button.primary:hover {
            background: #1e53e5;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #1e222d;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #2a2e39;
        }

        .stat-label {
            font-size: 12px;
            color: #787b86;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 500;
        }

        #chart {
            width: 100%;
            height: 600px;
            background: #1e222d;
            border-radius: 6px;
            border: 1px solid #2a2e39;
        }

        .status {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 4px;
            font-size: 14px;
        }

        .status.loading {
            background: #2a2e39;
            color: #787b86;
        }

        .status.success {
            background: rgba(41, 98, 255, 0.1);
            border: 1px solid #2962ff;
            color: #2962ff;
        }

        .status.error {
            background: rgba(255, 82, 82, 0.1);
            border: 1px solid #ff5252;
            color: #ff5252;
        }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #787b86;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Bybit Chart - BTCUSDT</h1>
            <div class="controls">
                <div class="control-group">
                    <label>Interval</label>
                    <select id="interval">
                        <option value="1m">1m</option>
                        <option value="5m">5m</option>
                        <option value="15m" selected>15m</option>
                        <option value="30m">30m</option>
                        <option value="1h">1h</option>
                        <option value="4h">4h</option>
                        <option value="1d">1d</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>Range (hours)</label>
                    <select id="range">
                        <option value="1">1h</option>
                        <option value="6">6h</option>
                        <option value="24" selected>24h</option>
                        <option value="72">3d</option>
                        <option value="168">7d</option>
                    </select>
                </div>
                <div class="control-group">
                    <label>&nbsp;</label>
                    <button id="loadBtn" class="primary">Load Data</button>
                </div>
            </div>
        </header>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Candles</div>
                <div class="stat-value" id="candleCount">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Volume</div>
                <div class="stat-value" id="totalVolume">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Trades</div>
                <div class="stat-value" id="totalTrades">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Price Range</div>
                <div class="stat-value" id="priceRange">-</div>
            </div>
        </div>

        <div id="chart"></div>

        <div id="status" class="status" style="display: none;"></div>
    </div>

    <script>
        // Configuration
        const API_BASE_URL = 'http://127.0.0.1:8000/api/v1';
        const SYMBOL = 'BTCUSDT';

        // Price/qty scaling (from packages/numeric/constants.py)
        const BTCUSDT_PRICE_TICK = 0.01;
        const BTCUSDT_QTY_STEP = 0.001;

        // Chart instance
        let chart = null;
        let candlestickSeries = null;

        // Initialize chart
        function initChart() {
            const chartContainer = document.getElementById('chart');

            chart = LightweightCharts.createChart(chartContainer, {
                width: chartContainer.clientWidth,
                height: 600,
                layout: {
                    background: { color: '#1e222d' },
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: '#2a2e39' },
                    horzLines: { color: '#2a2e39' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: '#2a2e39',
                },
                timeScale: {
                    borderColor: '#2a2e39',
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#26a69a',
                downColor: '#ef5350',
                borderVisible: false,
                wickUpColor: '#26a69a',
                wickDownColor: '#ef5350',
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                chart.applyOptions({
                    width: chartContainer.clientWidth
                });
            });
        }

        // Show status message
        function showStatus(message, type = 'loading') {
            const statusEl = document.getElementById('status');
            statusEl.className = `status ${type}`;

            if (type === 'loading') {
                statusEl.innerHTML = `<span class="loading-spinner"></span>${message}`;
            } else {
                statusEl.textContent = message;
            }

            statusEl.style.display = 'block';

            if (type === 'success' || type === 'error') {
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 5000);
            }
        }

        // Update stats
        function updateStats(candles) {
            const candleCount = candles.length;
            const totalVolume = candles.reduce((sum, c) => sum + c.volume_steps, 0);
            const totalTrades = candles.reduce((sum, c) => sum + c.trade_count, 0);

            const prices = candles.flatMap(c => [c.high_ticks, c.low_ticks]);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);

            document.getElementById('candleCount').textContent = candleCount.toLocaleString();
            document.getElementById('totalVolume').textContent = (totalVolume * BTCUSDT_QTY_STEP).toFixed(3);
            document.getElementById('totalTrades').textContent = totalTrades.toLocaleString();
            document.getElementById('priceRange').textContent =
                `$${(minPrice * BTCUSDT_PRICE_TICK).toFixed(2)} - $${(maxPrice * BTCUSDT_PRICE_TICK).toFixed(2)}`;
        }

        // Load OHLC data from API
        async function loadData() {
            const interval = document.getElementById('interval').value;
            const rangeHours = parseInt(document.getElementById('range').value);

            const endTs = Date.now() * 1000; // current time in microseconds
            const startTs = endTs - (rangeHours * 60 * 60 * 1000 * 1000); // range in microseconds

            showStatus('Loading candles...', 'loading');

            try {
                const url = `${API_BASE_URL}/ohlc?symbol=${SYMBOL}&start_ts=${startTs}&end_ts=${endTs}&interval=${interval}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();

                if (!data.candles || data.candles.length === 0) {
                    showStatus('No data available for selected range', 'error');
                    return;
                }

                // Convert ticks → price for TradingView
                const chartData = data.candles.map(candle => ({
                    time: Math.floor(candle.timestamp_us / 1_000_000), // µs → seconds
                    open: candle.open_ticks * BTCUSDT_PRICE_TICK,
                    high: candle.high_ticks * BTCUSDT_PRICE_TICK,
                    low: candle.low_ticks * BTCUSDT_PRICE_TICK,
                    close: candle.close_ticks * BTCUSDT_PRICE_TICK,
                    volume_steps: candle.volume_steps,
                    trade_count: candle.trade_count,
                }));

                // Update chart
                candlestickSeries.setData(chartData);
                chart.timeScale().fitContent();

                // Update stats
                updateStats(data.candles);

                showStatus(`Loaded ${data.count} candles`, 'success');

            } catch (error) {
                console.error('Error loading data:', error);
                showStatus(`Error: ${error.message}`, 'error');
            }
        }

        // Event listeners
        document.getElementById('loadBtn').addEventListener('click', loadData);

        // Initialize
        initChart();

        // Auto-load on page load
        window.addEventListener('load', () => {
            setTimeout(loadData, 500);
        });
    </script>
</body>
</html>
