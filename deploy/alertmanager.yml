# Alertmanager configuration для bybit-chart (Этап 5.1.4)

global:
  resolve_timeout: 5m
  # SMTP configuration (для email alerts)
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@bybit-chart.local'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

# Templates для форматирования alerts
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Route configuration
route:
  # Default receiver для всех alerts
  receiver: 'default'

  # Group alerts по component (collector/analytics/orderflow/maintenance/api)
  group_by: ['alertname', 'component']

  # Как долго ждать перед отправкой первой группы alerts
  group_wait: 30s

  # Как долго ждать перед отправкой новых alerts в уже существующую группу
  group_interval: 5m

  # Как часто повторно отправлять alerts если они не resolved
  repeat_interval: 4h

  # Sub-routes для разных severity levels
  routes:
    # Critical alerts → immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 30m
      continue: true  # Также отправить в default receiver

    # Warning alerts → standard notification
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 2h

    # Info alerts → low priority
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 12h

# Inhibition rules (не отправлять minor alerts если уже есть major)
inhibit_rules:
  # Если process down, не отправлять component-specific alerts
  - source_match:
      severity: 'critical'
      alertname: 'CollectorProcessDown'
    target_match:
      component: 'collector'
    equal: ['component']

  - source_match:
      severity: 'critical'
      alertname: 'OrderflowProcessDown'
    target_match:
      component: 'orderflow'
    equal: ['component']

  # Если multiple processes down, не отправлять single process alerts
  - source_match:
      alertname: 'MultipleProcessesDown'
    target_match_re:
      alertname: '.*ProcessDown'
    equal: ['instance']

# Receivers (notification channels)
receivers:
  # Default receiver (все alerts)
  - name: 'default'
    email_configs:
      - to: 'team@example.com'
        headers:
          Subject: '[Bybit Chart] {{ .GroupLabels.alertname }}'
        html: '{{ template "email.html" . }}'

  # Critical alerts (PagerDuty + Slack)
  - name: 'critical-alerts'
    pagerduty_configs:
      - service_key: 'your-pagerduty-service-key'
        description: '{{ .GroupLabels.alertname }}: {{ .CommonAnnotations.summary }}'

    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: 'danger'
        send_resolved: true

  # Warning alerts (Slack only)
  - name: 'warning-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts-warning'
        title: '⚠️ WARNING: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: 'warning'
        send_resolved: true

  # Info alerts (Slack low-priority channel)
  - name: 'info-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        channel: '#alerts-info'
        title: 'ℹ️ INFO: {{ .GroupLabels.alertname }}'
        text: '{{ .CommonAnnotations.description }}'
        color: 'good'
        send_resolved: true
