[project]
name = "venue-neutral-arbitrage-paper"
version = "0.1.0"
description = "Public-data-only, venue-neutral spot arbitrage PAPER prototype"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "pydantic==2.11.1",
    "uvicorn==0.32.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==0.25.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "contract: deterministic domain, API, and UI contract tests",
]
