<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bybit Chart - Paper Trading</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #131722;
            color: #d1d4dc;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #2a2e39;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
        }

        .account-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #1e222d;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #2a2e39;
        }

        .stat-label {
            font-size: 11px;
            color: #787b86;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
        }

        .stat-value.positive {
            color: #26a69a;
        }

        .stat-value.negative {
            color: #ef5350;
        }

        .grid-3col {
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: #1e222d;
            border-radius: 6px;
            border: 1px solid #2a2e39;
            padding: 15px;
        }

        .panel-header {
            font-size: 14px;
            font-weight: 600;
            color: #787b86;
            text-transform: uppercase;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2e39;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #787b86;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        select, input {
            width: 100%;
            background: #131722;
            border: 1px solid #2a2e39;
            color: #d1d4dc;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        button {
            width: 100%;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            margin-top: 5px;
        }

        .btn-buy {
            background: #26a69a;
        }

        .btn-buy:hover {
            background: #229186;
        }

        .btn-sell {
            background: #ef5350;
        }

        .btn-sell:hover {
            background: #e53935;
        }

        .btn-close {
            background: #787b86;
        }

        .btn-close:hover {
            background: #6a6d75;
        }

        #equityChart {
            height: 300px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #2a2e39;
            font-size: 12px;
        }

        th {
            color: #787b86;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 600;
        }

        .position-long {
            color: #26a69a;
        }

        .position-short {
            color: #ef5350;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #787b86;
            font-size: 13px;
        }

        .trade-row {
            cursor: pointer;
        }

        .trade-row:hover {
            background: #2a2e39;
        }

        .pnl-positive {
            color: #26a69a;
        }

        .pnl-negative {
            color: #ef5350;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Paper Trading Dashboard</h1>
        </header>

        <!-- Account Stats -->
        <div class="account-stats">
            <div class="stat-card">
                <div class="stat-label">Equity</div>
                <div class="stat-value" id="equity">$100,000</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Cash Balance</div>
                <div class="stat-value" id="balance">$100,000</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Unrealized P&L</div>
                <div class="stat-value" id="unrealizedPnL">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Realized P&L</div>
                <div class="stat-value" id="realizedPnL">$0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value" id="winRate">0%</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid-3col">
            <!-- Order Entry -->
            <div class="panel">
                <div class="panel-header">Place Order</div>

                <div class="form-group">
                    <label>Symbol</label>
                    <select id="orderSymbol">
                        <option value="BTCUSDT">BTCUSDT</option>
                        <option value="ETHUSDT">ETHUSDT</option>
                        <option value="XRPUSDT">XRPUSDT</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Quantity</label>
                    <input type="number" id="orderQuantity" step="0.001" value="1.0" placeholder="1.0">
                </div>

                <div class="form-group">
                    <label>Order Type</label>
                    <select id="orderType">
                        <option value="market">Market</option>
                        <option value="limit" disabled>Limit (Coming Soon)</option>
                    </select>
                </div>

                <button class="btn-buy" onclick="placeOrder('buy')">Buy / Long</button>
                <button class="btn-sell" onclick="placeOrder('sell')">Sell / Short</button>
            </div>

            <!-- Equity Curve -->
            <div class="panel">
                <div class="panel-header">Equity Curve</div>
                <div id="equityChart"></div>
            </div>

            <!-- Positions -->
            <div class="panel">
                <div class="panel-header">Open Positions</div>
                <div id="positions">
                    <div class="empty-state">No open positions</div>
                </div>
            </div>
        </div>

        <!-- Trade History -->
        <div class="panel">
            <div class="panel-header">Trade History</div>
            <div style="max-height: 300px; overflow-y: auto;">
                <table id="tradeHistory">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Symbol</th>
                            <th>Side</th>
                            <th>Quantity</th>
                            <th>Price</th>
                            <th>Value</th>
                            <th>Commission</th>
                        </tr>
                    </thead>
                    <tbody id="tradeHistoryBody">
                        <tr>
                            <td colspan="7" class="empty-state">No trades yet</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Mock Paper Trading Engine (simplified)
        class SimplePaperTrading {
            constructor() {
                this.account = {
                    initial_balance: 100000,
                    balance: 100000,
                    equity: 100000,
                    unrealized_pnl: 0,
                    realized_pnl: 0,
                    total_commission: 0,
                    total_trades: 0,
                    winning_trades: 0,
                };

                this.positions = {};
                this.trades = [];
                this.equity_history = [{ time: Date.now() / 1000, value: 100000 }];
                this.commission_rate = 0.0006;

                this.loadFromStorage();
            }

            placeOrder(symbol, side, quantity, price) {
                const value = quantity * price;
                const commission = value * this.commission_rate;

                const trade = {
                    time: new Date().toLocaleTimeString(),
                    timestamp: Date.now(),
                    symbol,
                    side,
                    quantity,
                    price,
                    value,
                    commission,
                };

                this.trades.push(trade);

                // Update position
                if (!this.positions[symbol]) {
                    this.positions[symbol] = { side: 'flat', quantity: 0, entry_price: 0 };
                }

                const position = this.positions[symbol];

                if (side === 'buy') {
                    if (position.side === 'flat') {
                        // Open LONG
                        this.account.balance -= (value + commission);
                        position.side = 'long';
                        position.quantity = quantity;
                        position.entry_price = price;
                    } else if (position.side === 'short') {
                        // Close SHORT
                        const pnl = (position.entry_price - price) * quantity - commission;
                        this.account.balance += pnl;
                        this.account.realized_pnl += pnl;
                        this.account.total_trades++;
                        if (pnl > 0) this.account.winning_trades++;
                        position.side = 'flat';
                        position.quantity = 0;
                    }
                } else {
                    if (position.side === 'flat') {
                        // Open SHORT
                        this.account.balance += (value - commission);
                        position.side = 'short';
                        position.quantity = quantity;
                        position.entry_price = price;
                    } else if (position.side === 'long') {
                        // Close LONG
                        const pnl = (price - position.entry_price) * quantity - commission;
                        this.account.balance += pnl;
                        this.account.realized_pnl += pnl;
                        this.account.total_trades++;
                        if (pnl > 0) this.account.winning_trades++;
                        position.side = 'flat';
                        position.quantity = 0;
                    }
                }

                this.account.total_commission += commission;
                this.account.equity = this.account.balance;

                this.equity_history.push({
                    time: Date.now() / 1000,
                    value: this.account.equity,
                });

                this.saveToStorage();
                return trade;
            }

            closePosition(symbol, price) {
                const position = this.positions[symbol];
                if (!position || position.side === 'flat') return;

                const side = position.side === 'long' ? 'sell' : 'buy';
                return this.placeOrder(symbol, side, position.quantity, price);
            }

            saveToStorage() {
                localStorage.setItem('paper_trading_account', JSON.stringify(this.account));
                localStorage.setItem('paper_trading_positions', JSON.stringify(this.positions));
                localStorage.setItem('paper_trading_trades', JSON.stringify(this.trades));
                localStorage.setItem('paper_trading_equity', JSON.stringify(this.equity_history));
            }

            loadFromStorage() {
                const account = localStorage.getItem('paper_trading_account');
                if (account) this.account = JSON.parse(account);

                const positions = localStorage.getItem('paper_trading_positions');
                if (positions) this.positions = JSON.parse(positions);

                const trades = localStorage.getItem('paper_trading_trades');
                if (trades) this.trades = JSON.parse(trades);

                const equity = localStorage.getItem('paper_trading_equity');
                if (equity) this.equity_history = JSON.parse(equity);
            }

            reset() {
                if (confirm('Reset all paper trading data?')) {
                    localStorage.removeItem('paper_trading_account');
                    localStorage.removeItem('paper_trading_positions');
                    localStorage.removeItem('paper_trading_trades');
                    localStorage.removeItem('paper_trading_equity');
                    location.reload();
                }
            }
        }

        // Initialize
        const paperTrading = new SimplePaperTrading();
        let equityChart = null;

        // Initialize Equity Chart
        function initEquityChart() {
            equityChart = LightweightCharts.createChart(document.getElementById('equityChart'), {
                width: document.getElementById('equityChart').clientWidth,
                height: 300,
                layout: { background: { color: '#1e222d' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
                timeScale: { timeVisible: true },
            });

            const lineSeries = equityChart.addLineSeries({ color: '#2962ff', lineWidth: 2 });
            lineSeries.setData(paperTrading.equity_history);

            window.addEventListener('resize', () => {
                equityChart.applyOptions({ width: document.getElementById('equityChart').clientWidth });
            });
        }

        // Update UI
        function updateUI() {
            const acc = paperTrading.account;

            document.getElementById('equity').textContent = `$${acc.equity.toFixed(2)}`;
            document.getElementById('balance').textContent = `$${acc.balance.toFixed(2)}`;

            const unrealizedEl = document.getElementById('unrealizedPnL');
            unrealizedEl.textContent = `$${acc.unrealized_pnl.toFixed(2)}`;
            unrealizedEl.className = `stat-value ${acc.unrealized_pnl >= 0 ? 'positive' : 'negative'}`;

            const realizedEl = document.getElementById('realizedPnL');
            realizedEl.textContent = `$${acc.realized_pnl.toFixed(2)}`;
            realizedEl.className = `stat-value ${acc.realized_pnl >= 0 ? 'positive' : 'negative'}`;

            const winRate = acc.total_trades > 0 ? (acc.winning_trades / acc.total_trades * 100) : 0;
            document.getElementById('winRate').textContent = `${winRate.toFixed(1)}%`;

            updatePositions();
            updateTradeHistory();
        }

        // Update Positions
        function updatePositions() {
            const container = document.getElementById('positions');
            const positions = Object.entries(paperTrading.positions).filter(([_, pos]) => pos.side !== 'flat');

            if (positions.length === 0) {
                container.innerHTML = '<div class="empty-state">No open positions</div>';
                return;
            }

            let html = '<table><thead><tr><th>Symbol</th><th>Side</th><th>Qty</th><th>Entry</th><th></th></tr></thead><tbody>';

            positions.forEach(([symbol, pos]) => {
                html += `
                    <tr>
                        <td>${symbol}</td>
                        <td class="position-${pos.side}">${pos.side.toUpperCase()}</td>
                        <td>${pos.quantity}</td>
                        <td>$${pos.entry_price.toFixed(2)}</td>
                        <td><button class="btn-close" style="padding: 5px 10px; margin: 0;" onclick="closePosition('${symbol}')">Close</button></td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Update Trade History
        function updateTradeHistory() {
            const tbody = document.getElementById('tradeHistoryBody');

            if (paperTrading.trades.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No trades yet</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            paperTrading.trades.slice().reverse().slice(0, 20).forEach(trade => {
                const row = document.createElement('tr');
                row.className = 'trade-row';
                row.innerHTML = `
                    <td>${trade.time}</td>
                    <td>${trade.symbol}</td>
                    <td class="position-${trade.side}">${trade.side.toUpperCase()}</td>
                    <td>${trade.quantity}</td>
                    <td>$${trade.price.toFixed(2)}</td>
                    <td>$${trade.value.toFixed(2)}</td>
                    <td>$${trade.commission.toFixed(2)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Place Order
        window.placeOrder = function(side) {
            const symbol = document.getElementById('orderSymbol').value;
            const quantity = parseFloat(document.getElementById('orderQuantity').value);

            if (!quantity || quantity <= 0) {
                alert('Invalid quantity');
                return;
            }

            // Mock price (in production, get from market data)
            const mockPrices = { 'BTCUSDT': 65000, 'ETHUSDT': 3200, 'XRPUSDT': 0.55 };
            const price = mockPrices[symbol];

            paperTrading.placeOrder(symbol, side, quantity, price);
            updateUI();
        };

        // Close Position
        window.closePosition = function(symbol) {
            const mockPrices = { 'BTCUSDT': 65000, 'ETHUSDT': 3200, 'XRPUSDT': 0.55 };
            const price = mockPrices[symbol];

            paperTrading.closePosition(symbol, price);
            updateUI();
        };

        // Initialize
        initEquityChart();
        updateUI();
    </script>
</body>
</html>
