name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies from lock
      run: |
        python -m venv .venv
        source .venv/bin/activate
        if [ -f deploy/dependencies/linux-x86_64/requirements.lock ]; then
          pip install --require-hashes -r deploy/dependencies/linux-x86_64/requirements.lock
        else
          pip install -r requirements.in
        fi

    - name: Run tests
      run: |
        source .venv/bin/activate
        PYTHONPATH=. pytest -v --tb=short

    - name: Run fault tests
      run: |
        source .venv/bin/activate
        PYTHONPATH=. pytest tests/fault -v --tb=short

    - name: Verify dependencies
      run: |
        source .venv/bin/activate
        python deploy/verify_dependencies.py

  release-gate:
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install production dependencies from lock
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --require-hashes -r deploy/dependencies/linux-x86_64/requirements.lock

    - name: Verify release artifacts
      run: |
        source .venv/bin/activate
        python deploy/verify_dependencies.py --release

    - name: Run full test suite
      run: |
        source .venv/bin/activate
        PYTHONPATH=. pytest -v --tb=short

  lint:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install ruff
      run: uv tool install ruff

    - name: Run ruff check
      run: ~/.local/bin/ruff check . || true

    - name: Run ruff format check
      run: ~/.local/bin/ruff format --check . || true
